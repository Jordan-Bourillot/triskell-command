name: Phare scheduler (cron horaire)

# Tourne toutes les heures pour exécuter le tick du scheduler Le Phare,
# en complètement autonome (pas besoin que Triskell Command desktop tourne
# sur le PC de Jordan). Voir scripts/phare_tick.py pour le détail.

on:
  schedule:
    # Minute 23 (creuse) : GitHub saute/retarde beaucoup les crons des minutes
    # 0-10, surchargées. Constaté avant le 12/06/2026 : 3 ticks sur 4 perdus
    # avec HH:05. Le tick lui-même vérifie l'heure et lance les missions.
    - cron: '23 * * * *'
    # Renfort du lundi (heures UTC = 6h-23h Paris l'été) : 2e passage par
    # heure pendant la fenêtre d'audit hebdo, car l'audit traite 1 site par
    # tick — avec 7 sites et des ticks qui sautent, la journée ne suffisait
    # pas (Pixel Pros et Ingrid jamais audités le 08/06). La dédup DB
    # (_pick_next_for_mission) garantit qu'un tick en double ne refait ni ne
    # repaye aucun travail.
    - cron: '53 4-21 * * 1'
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

# Évite que deux ticks tournent en parallèle si un précédent traîne
concurrency:
  group: phare-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Les fenêtres horaires du scheduler (audit lundi 6-22h, bulletin 8h…)
      # sont pensées en heure française ; sans ça le runner est en UTC et
      # tout est décalé de 1-2h selon la saison.
      TZ: Europe/Paris

    steps:
      - name: Checkout Triskell Command
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Clone triskell-core (sibling repo)
        run: |
          git clone --depth 1 https://github.com/Jordan-Bourillot/triskell-core.git ../triskell-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../triskell-core
          pip install -r requirements.txt
          # Web Push (pour notifs phare → Jordan)
          pip install pywebpush

      - name: Run scheduler tick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/phare_tick.py
