name: Phare scheduler (cron horaire)

# Tourne toutes les heures pour exécuter le tick du scheduler Le Phare,
# en complètement autonome (pas besoin que Triskell Command desktop tourne
# sur le PC de Jordan). Voir scripts/phare_tick.py pour le détail.

on:
  schedule:
    # RÉDUIT le 22/06/2026 : de 24 passages/jour (+ renfort lundi 2×/h) à 3.
    # Pourquoi : chaque passage peut publier une correction = une reconstruction
    # du site chez Netlify (branche/preview + merge). L'ancien rythme horaire
    # saturait le crédit Netlify du compte (≈28 branches en 8 jours → builds
    # refusés « credit usage exceeded »).
    # 3 passages (heures UTC ; le code tourne en TZ=Europe/Paris) couvrent les
    # fenêtres clés : ~10h Paris (optims du matin), ~16h (auto-merge des PR
    # vérifiées, ≥15h), ~20h (récap quotidien, ≥19h). Les missions sont
    # dédupliquées en base (1×/jour/site), donc un seul passage par fenêtre
    # suffit — pas besoin du rythme horaire.
    - cron: '23 8,14,18 * * *'
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

# Évite que deux ticks tournent en parallèle si un précédent traîne
concurrency:
  group: phare-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Les fenêtres horaires du scheduler (audit lundi 6-22h, bulletin 8h…)
      # sont pensées en heure française ; sans ça le runner est en UTC et
      # tout est décalé de 1-2h selon la saison.
      TZ: Europe/Paris

    steps:
      - name: Checkout Triskell Command
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Clone triskell-core (sibling repo)
        run: |
          git clone --depth 1 https://github.com/Jordan-Bourillot/triskell-core.git ../triskell-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../triskell-core
          pip install -r requirements.txt
          # Web Push (pour notifs phare → Jordan)
          pip install pywebpush
          # Search Console : gsc.py exige google-auth-oauthlib pour le
          # chemin OAuth user (sans lui, import KO → GSC silencieusement vide)
          pip install google-auth google-auth-oauthlib

      - name: Pose les accès Search Console (si les secrets existent)
        env:
          GSC_OAUTH_CLIENT_JSON: ${{ secrets.GSC_OAUTH_CLIENT_JSON }}
          GSC_OAUTH_TOKEN_JSON: ${{ secrets.GSC_OAUTH_TOKEN_JSON }}
        run: |
          # gsc.py lit ~/.triskell-command/gsc-oauth-{client,token}.json
          # (chemins codés en dur). On matérialise les secrets en fichiers ;
          # sans secrets, le tick tourne comme avant (GSC ignorée proprement).
          if [ -n "$GSC_OAUTH_CLIENT_JSON" ] && [ -n "$GSC_OAUTH_TOKEN_JSON" ]; then
            mkdir -p ~/.triskell-command
            printf '%s' "$GSC_OAUTH_CLIENT_JSON" > ~/.triskell-command/gsc-oauth-client.json
            printf '%s' "$GSC_OAUTH_TOKEN_JSON" > ~/.triskell-command/gsc-oauth-token.json
            echo "Accès Search Console posés pour ce tick."
          else
            echo "Pas de secrets GSC : tick sans Search Console."
          fi

      - name: Run scheduler tick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/phare_tick.py
