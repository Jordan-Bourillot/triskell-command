[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triskell-command"
version = "0.4.0"
description = "Cockpit interne Triskell Studio (prospection, IA, envoi, KPIs)"
authors = [{ name = "Jordan — Triskell Studio" }]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "Pillow>=10.0",
    "pyperclip>=1.8",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "triskell-core",
]

[tool.setuptools.packages.find]
include = ["triskell_command*"]
