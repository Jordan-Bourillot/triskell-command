<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Triskell Command</title>

  <!-- Tailwind via CDN (suffit pour le prototype, on packagera après) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

  <script>
    // Configuration Tailwind avec nos tokens (HSL via vars CSS)
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            display: ['Cinzel', 'ui-serif', 'serif'],
          },
          colors: {
            bg:        'hsl(var(--bg) / <alpha-value>)',
            surface:   'hsl(var(--surface) / <alpha-value>)',
            'surface-elevated': 'hsl(var(--surface-elevated) / <alpha-value>)',
            border:    'hsl(var(--border) / <alpha-value>)',
            'border-strong': 'hsl(var(--border-strong) / <alpha-value>)',
            text:      'hsl(var(--text) / <alpha-value>)',
            'text-muted': 'hsl(var(--text-muted) / <alpha-value>)',
            'text-secondary': 'hsl(var(--text-secondary) / <alpha-value>)',
            accent:    'hsl(var(--accent) / <alpha-value>)',
            'accent-hover': 'hsl(var(--accent-hover) / <alpha-value>)',
            'accent-glow':  'hsl(var(--accent-glow) / <alpha-value>)',
            success:   'hsl(var(--success) / <alpha-value>)',
            warning:   'hsl(var(--warning) / <alpha-value>)',
            danger:    'hsl(var(--danger) / <alpha-value>)',
            gold:      'hsl(var(--gold) / <alpha-value>)',
          },
          boxShadow: {
            'soft': '0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.06)',
            'lift': '0 4px 12px rgba(15,23,42,0.08), 0 12px 32px rgba(15,23,42,0.10)',
            'hero': '0 10px 40px rgba(99,102,241,0.18), 0 2px 8px rgba(15,23,42,0.06)',
            'fab':  '0 6px 16px rgba(99,102,241,0.32), 0 2px 6px rgba(15,23,42,0.10)',
          },
          animation: {
            'breathe': 'breathe 2.6s ease-in-out infinite',
            'pulse-fast': 'pulseFast 1.1s ease-in-out infinite',
            'fade-in':  'fadeIn 280ms ease-out forwards',
            'slide-up': 'slideUp 340ms cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            breathe: {
              '0%,100%': { transform: 'scale(1)',  boxShadow: '0 6px 16px rgba(99,102,241,0.32)' },
              '50%':     { transform: 'scale(1.04)', boxShadow: '0 8px 24px rgba(99,102,241,0.45)' },
            },
            pulseFast: {
              '0%,100%': { transform: 'scale(1)',    boxShadow: '0 0 0 0 rgba(239,68,68,0.55)' },
              '50%':     { transform: 'scale(1.06)', boxShadow: '0 0 0 14px rgba(239,68,68,0)' },
            },
            fadeIn:  { 'from': { opacity: 0 }, 'to': { opacity: 1 } },
            slideUp: {
              'from': { opacity: 0, transform: 'translateY(12px)' },
              'to':   { opacity: 1, transform: 'translateY(0)' },
            },
          },
        },
      },
    };
  </script>
</head>

<body class="font-sans antialiased bg-bg text-text h-screen overflow-hidden md:overflow-hidden">

  <!-- ===================== Header MOBILE (visible <md uniquement) ===================== -->
  <!-- Bouton burger + brand. Le bouton ouvre la sidebar en drawer (slide-in). -->
  <header id="mobile-header"
          class="md:hidden fixed top-0 inset-x-0 z-30 h-14 bg-surface border-b border-border
                 flex items-center justify-between px-4">
    <button id="mobile-menu-toggle"
            aria-label="Ouvrir le menu"
            class="w-10 h-10 flex items-center justify-center rounded-lg
                   text-text hover:bg-bg active:scale-95 transition-all">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6" stroke-linecap="round" />
        <line x1="3" y1="12" x2="21" y2="12" stroke-linecap="round" />
        <line x1="3" y1="18" x2="21" y2="18" stroke-linecap="round" />
      </svg>
    </button>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-accent to-accent-glow shadow-soft flex items-center justify-center text-white font-bold text-sm">⛯</div>
      <div class="font-display text-base font-bold leading-none">Triskell</div>
    </div>
    <div class="w-10 h-10"></div> <!-- spacer pour centrer le brand -->
  </header>

  <!-- Overlay foncé qui apparaît derrière le drawer mobile (clique pour fermer) -->
  <div id="mobile-sidebar-overlay"
       class="md:hidden fixed inset-0 z-40 bg-black/50 hidden"></div>

  <div class="flex h-screen pt-14 md:pt-0">
    <!-- ===================== Sidebar ===================== -->
    <!-- Desktop : statique à gauche.
         Mobile : drawer fixe, caché par défaut (-translate-x-full),
                  s'ouvre quand on toggle .sidebar-open sur le body. -->
    <aside id="sidebar"
           class="fixed md:static top-0 left-0 z-50 h-full w-72 md:w-64 shrink-0
                  bg-surface border-r border-border flex flex-col
                  transform -translate-x-full md:translate-x-0
                  transition-transform duration-200 ease-out">
      <!-- Brand + bouton fermer (mobile uniquement) -->
      <div class="px-6 pt-6 pb-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-accent to-accent-glow shadow-soft flex items-center justify-center text-white font-bold">
            ⛯
          </div>
          <div>
            <div class="font-display text-lg font-bold leading-none">Triskell</div>
            <div class="text-[10px] tracking-widest font-bold text-accent mt-1">COMMAND</div>
          </div>
        </div>
        <button id="mobile-sidebar-close"
                aria-label="Fermer le menu"
                class="md:hidden w-9 h-9 flex items-center justify-center rounded-lg
                       text-text-muted hover:text-text hover:bg-bg active:scale-95 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round" />
            <line x1="18" y1="6" x2="6" y2="18" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <hr class="border-border mx-6" />

      <!-- Bouton "Outils Triskell" — ouvre le launcher Spotlight -->
      <div class="px-3 pt-3 pb-1">
        <button id="launcher-trigger"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl
                       border border-border bg-bg
                       hover:border-accent hover:bg-surface-elevated
                       transition-all duration-160 group">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-accent-glow
                      flex items-center justify-center shrink-0">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1.4"/>
              <rect x="14" y="3" width="7" height="7" rx="1.4"/>
              <rect x="14" y="14" width="7" height="7" rx="1.4"/>
              <rect x="3" y="14" width="7" height="7" rx="1.4"/>
            </svg>
          </div>
          <div class="flex-1 text-left">
            <div class="text-[13px] font-semibold leading-none mb-0.5">Outils Triskell</div>
            <div class="text-[10.5px] text-text-muted">Tous tes produits</div>
          </div>
          <kbd class="text-[9.5px] font-bold text-text-muted bg-surface
                      px-1.5 py-0.5 rounded border border-border shrink-0">⌃ K</kbd>
        </button>
      </div>

      <!-- Bouton "Écosystème" — ouvre la carte mentale interne dans le navigateur -->
      <div class="px-3 pt-1 pb-1">
        <button id="ecosysteme-trigger"
                title="Vue d'ensemble de l'écosystème Triskell (interne)"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl
                       border border-border bg-bg
                       hover:border-gold hover:bg-surface-elevated
                       transition-all duration-160 group">
          <div class="w-8 h-8 rounded-lg
                      bg-gradient-to-br from-gold to-accent-glow
                      flex items-center justify-center shrink-0
                      shadow-soft">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l2.4 6.4L21 9.3l-5 4.5L17.6 21 12 17.5 6.4 21 8 13.8 3 9.3l6.6-.9L12 2z"/>
            </svg>
          </div>
          <div class="flex-1 text-left">
            <div class="text-[13px] font-semibold leading-none mb-0.5">Écosystème</div>
            <div class="text-[10.5px] text-text-muted">Vue d'ensemble · interne</div>
          </div>
          <svg class="w-3.5 h-3.5 text-text-muted shrink-0
                      group-hover:text-gold transition-colors"
               fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M7 17L17 7M17 7H8M17 7v9"/>
          </svg>
        </button>
      </div>

      <!-- Sections de navigation -->
      <nav class="flex-1 overflow-y-auto px-3 pt-3 pb-4 space-y-6">
        <div>
          <div class="px-3 text-[10px] font-bold tracking-widest text-text-muted mb-2">LE MATIN</div>
          <button data-view="morning" class="nav-item active">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 13h2l3-9 4 18 3-9h6"/></svg>
            <span>Matinale</span>
          </button>
        </div>
        <div>
          <div class="px-3 text-[10px] font-bold tracking-widest text-text-muted mb-2">L'APP TRAVAILLE POUR TOI</div>
          <button data-view="autopilot" class="nav-item">
            <img src="assets/apps/obelisk.png" class="nav-item-logo" alt="" />
            <span>Auto-pilote</span>
          </button>
          <button data-view="convoy" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Importer une liste</span>
          </button>
          <button data-view="drafts" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Brouillons à valider</span>
          </button>
          <button data-view="replies" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1 0 2 1 2 2v12c0 1-1 2-2 2H4c-1 0-2-1-2-2V6c0-1 1-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
            <span>Réponses</span>
          </button>
          <button data-view="mails" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 8l10 6 10-6"/><path d="M16 19v-3"/></svg>
            <span>Mails (toutes les boîtes)</span>
          </button>
          <button data-view="brain" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 007 4.5v0A2.5 2.5 0 004.5 7v0A2.5 2.5 0 002 9.5v5A2.5 2.5 0 004.5 17v0A2.5 2.5 0 007 19.5v0A2.5 2.5 0 009.5 22h5a2.5 2.5 0 002.5-2.5v0a2.5 2.5 0 002.5-2.5v0A2.5 2.5 0 0022 14.5v-5A2.5 2.5 0 0019.5 7v0A2.5 2.5 0 0017 4.5v0A2.5 2.5 0 0014.5 2z"/><path d="M12 5v14"/></svg>
            <span>Brain (boîte à idées)</span>
          </button>
        </div>
        <div>
          <div class="px-3 text-[10px] font-bold tracking-widest text-text-muted mb-2">LIVRAISON</div>
          <button data-view="clients" class="nav-item">
            <img src="assets/apps/eliks-studio.svg" class="nav-item-logo" alt="" />
            <span>Projets clients</span>
          </button>
        </div>
        <div>
          <div class="px-3 text-[10px] font-bold tracking-widest text-text-muted mb-2">CHIFFRES</div>
          <button data-view="funnel" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
            <span>Conversions</span>
          </button>
        </div>
        <div>
          <div class="px-3 text-[10px] font-bold tracking-widest text-text-muted mb-2">VISIBILITÉ</div>
          <button data-view="phare" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v6M12 22v-3M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M2 12h6M22 12h-3M4.93 19.07l4.24-4.24M14.83 9.17l4.24-4.24"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Le Phare</span>
          </button>
        </div>
        <div>
          <div class="px-3 text-[10px] font-bold tracking-widest text-text-muted mb-2">PIPELINES SITES</div>
          <button data-view="lagriffe" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Lagriffe · pipeline</span>
          </button>
          <button data-view="rankus" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
            <span>RankUs · pipeline</span>
          </button>
          <button data-view="wow" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 6c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>
            <span>WoW · pipeline</span>
          </button>
        </div>
      </nav>

      <!-- Footer SYSTÈME -->
      <div class="px-3 py-4 border-t border-border space-y-1">
        <button data-view="tutorial" class="nav-item-sm"><span>Tuto</span></button>
        <button data-view="config"   class="nav-item-sm"><span>Réglages</span></button>

        <!-- Bandeau utilisateur connecté (rempli par user_badge.js) -->
        <div id="user-badge-slot" class="mt-3"></div>

        <div class="px-3 mt-3 text-[10px] text-text-muted">
          🌊 Bretagne · 100 % français
        </div>
        <div class="px-3 text-[10px] font-bold text-text-muted">v0.5</div>
      </div>
    </aside>

    <!-- ===================== Main area ===================== -->
    <main id="main" class="flex-1 overflow-y-auto relative w-full">
      <div id="content" class="px-4 py-5 sm:px-8 sm:py-8 md:px-12 md:py-10 max-w-[1280px]"></div>
    </main>
  </div>

  <!-- ===================== FAB Thomas (chat 1-à-1) ===================== -->
  <!-- Bouton flottant vert au-dessus du Claude FAB. Ouvre la modale de chat. -->
  <button id="thomas-fab"
          class="fixed right-8 z-50 w-14 h-14 rounded-full
                 flex items-center justify-center
                 text-white shadow-fab
                 transition-all duration-200
                 hover:scale-110 hover:shadow-hero
                 cursor-pointer
                 hidden"
          style="bottom: 116px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);"
          title="Chat avec Thomas · F11">
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <span id="thomas-fab-badge"
          class="absolute -top-1 -right-1 min-w-[20px] h-5 px-1.5 rounded-full
                 bg-danger text-white text-[10px] font-bold
                 flex items-center justify-center
                 ring-2 ring-bg
                 hidden">0</span>
  </button>

  <!-- ===================== Dialog Thomas (chat) ===================== -->
  <div id="thomas-dialog"
       class="fixed inset-0 z-[60] bg-black/40 hidden items-end justify-end p-8">
    <div class="bg-surface w-[420px] h-[620px] max-h-[90vh] rounded-2xl
                shadow-lift flex flex-col overflow-hidden border border-border">
      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-3
                  border-b border-border bg-surface-elevated">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full
                      flex items-center justify-center text-white font-bold"
               style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);"
               id="thomas-dialog-avatar">T</div>
          <div>
            <div id="thomas-dialog-name"
                 class="text-sm font-semibold text-text">Thomas</div>
            <div id="thomas-dialog-status"
                 class="text-[11px] text-text-muted">Chat 1-à-1</div>
          </div>
        </div>
        <button id="thomas-dialog-close"
                class="w-8 h-8 rounded-lg flex items-center justify-center
                       text-text-muted hover:text-text hover:bg-bg
                       transition-colors text-xl leading-none">×</button>
      </div>

      <!-- Liste des messages -->
      <div id="thomas-messages"
           class="flex-1 overflow-y-auto px-4 py-3 space-y-2 bg-bg"></div>

      <!-- Typing indicator (caché par défaut) -->
      <div id="thomas-typing"
           class="px-5 py-1 text-[11px] text-text-muted italic hidden">
        Thomas écrit…
      </div>

      <!-- Composer -->
      <div class="p-3 border-t border-border bg-surface flex gap-2">
        <input id="thomas-input" type="text"
               placeholder="Écris un message à Thomas…"
               autocomplete="off"
               class="flex-1 px-3 py-2 rounded-lg bg-bg
                      border border-border
                      text-sm text-text
                      placeholder:text-text-muted
                      focus:border-accent focus:outline-none
                      transition-colors"/>
        <button id="thomas-send"
                class="px-4 py-2 rounded-lg
                       bg-gradient-to-br from-accent to-accent-hover
                       text-white text-sm font-semibold
                       hover:shadow-soft transition-all
                       disabled:opacity-50 disabled:cursor-not-allowed">
          Envoyer
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== FAB Allô Claude ===================== -->
  <!-- Bloc flottant : label à gauche + bouton rond à droite -->
  <div id="claude-fab-wrap"
       class="fixed bottom-8 right-8 flex items-center gap-3 z-50">
    <!-- Label "Allô Claude" -->
    <span id="claude-fab-label"
          class="px-3 py-1.5 rounded-full text-sm font-semibold
                 bg-surface text-accent
                 shadow-soft border border-border
                 select-none cursor-pointer
                 transition-all duration-200
                 hover:scale-105 hover:shadow-lift">
      Allô Claude
    </span>
    <!-- Bouton rond -->
    <button id="claude-fab"
            class="relative w-16 h-16 rounded-full
                   bg-gradient-to-br from-accent to-accent-glow
                   shadow-fab flex items-center justify-center
                   text-white
                   transition-all duration-200
                   hover:scale-110 hover:shadow-hero
                   animate-breathe
                   cursor-pointer"
            title="Allô Claude · F12">
      <!-- Icône custom : bulle de dialogue + étincelle à l'intérieur -->
      <svg id="claude-fab-icon" class="w-7 h-7" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-5.3A8 8 0 1 1 21 12z" fill="currentColor" fill-opacity="0.18"/>
        <path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-5.3A8 8 0 1 1 21 12z"/>
        <path d="M12 8.5v3M12 12.5v3M8.5 12h3M12.5 12h3" stroke-width="1.6"/>
      </svg>
      <span id="claude-fab-dot"
            class="absolute top-1.5 right-1.5 w-3.5 h-3.5 rounded-full
                   bg-danger ring-2 ring-bg hidden"></span>
    </button>
  </div>

  <!-- ===================== Bus de templates de vues ===================== -->
  <template id="view-morning"></template>

  <!-- ===================== Scripts ===================== -->
  <script src="scripts/app.js"></script>
  <script src="scripts/morning.js"></script>
  <script src="scripts/replies.js"></script>
  <script src="scripts/drafts.js"></script>
  <script src="scripts/funnel.js"></script>
  <script src="scripts/clients.js"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/tutorial.js"></script>
  <script src="scripts/phare.js"></script>
  <script src="scripts/mails.js"></script>
  <script src="scripts/brain.js"></script>
  <script src="scripts/pipeline_view.js"></script>
  <script src="scripts/wow.js"></script>
  <script src="scripts/rankus.js"></script>
  <script src="scripts/lagriffe.js"></script>
  <script src="scripts/launcher.js"></script>
  <script src="scripts/teddy.js"></script>
  <script src="scripts/autopilot.js"></script>
  <script src="scripts/delivery.js"></script>
  <script src="scripts/health.js"></script>
  <script src="scripts/abtest.js"></script>
  <script src="scripts/help.js"></script>
  <script src="scripts/onboarding.js"></script>
  <script src="scripts/user_badge.js"></script>
  <script src="scripts/claude.js"></script>
