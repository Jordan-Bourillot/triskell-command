  <meta charset="utf-8" />
  <script>
    // Applique tout de suite le thème mémorisé — évite le flash de mauvaise
    // couleur au chargement, avant la réponse du serveur.
    try {
      var tcTheme = localStorage.getItem('tc-theme');
      if (tcTheme === 'light' || tcTheme === 'mid' || tcTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', tcTheme);
      }
    } catch (e) {}
  </script>

  <!-- ============================================================
       SPLASH SCREEN — Triskelion animé + texte qui apparaît
       Affiché au boot, fade out après ~2.2s
       ============================================================ -->
  <div id="triskell-splash"
       class="fixed inset-0 z-[9999] flex flex-col items-center justify-center"
       style="background: radial-gradient(ellipse at center, #1c1d3a 0%, #0a0b1e 75%); transition: opacity 700ms ease-out;">

    <!-- Logo Triskell qui pivote en arrivant (vraie image PNG, propre) -->
    <div id="splash-mark" class="relative" style="width: 180px; height: 180px;">
      <img src="/assets/icon-512.png" alt="Triskell" draggable="false"
           class="splash-rotor w-full h-full object-contain"
           style="border-radius: 28px;"/>
    </div>

    <!-- Texte qui apparaît après la rotation -->
    <div class="splash-name font-display text-white text-5xl font-bold tracking-wider mt-8" style="opacity: 0;">
      Triskell
    </div>
    <div class="splash-sub text-[10px] font-bold tracking-[0.5em] mt-2" style="color: #a78bfa; opacity: 0;">
      COMMAND
    </div>
    <div class="splash-tag mt-10 text-xs" style="color: rgba(255,255,255,0.45); opacity: 0;">
      🌊 Bretagne · 100 % français
    </div>
  </div>

  <style>
    /* === Splash animation === */
    @keyframes splashSpinIn {
      0%   { transform: rotate(-180deg) scale(0.3); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes splashGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.55)); }
      50%      { filter: drop-shadow(0 0 50px rgba(139, 92, 246, 0.95)); }
    }
    @keyframes splashFadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes splashBranchIn {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: 1; transform: scale(1); }
    }
    #triskell-splash .splash-rotor {
      animation: splashSpinIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center center;
      display: block;
    }
    #triskell-splash #splash-mark {
      animation: splashGlowPulse 2.6s ease-in-out infinite 1.4s;
    }
    #triskell-splash .splash-name { animation: splashFadeUp 0.7s 1.0s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    #triskell-splash .splash-sub  { animation: splashFadeUp 0.7s 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    #triskell-splash .splash-tag  { animation: splashFadeUp 0.7s 1.7s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    #triskell-splash.is-fading { opacity: 0; pointer-events: none; }

    /* Mobile : un peu plus petit */
    @media (max-width: 640px) {
      #triskell-splash #splash-mark { width: 140px !important; height: 140px !important; }
      #triskell-splash .splash-name { font-size: 36px; }
    }
  </style>

  <script>
    // Cache le splash dès que le DOM est prêt.
    // L'animation complète (~2.4 s) ne se joue qu'UNE fois par session :
    // aux chargements suivants, le splash disparaît presque immédiatement
    // (important sur une machine modeste + rechargements fréquents).
    (function() {
      let seen = false;
      try { seen = sessionStorage.getItem('tc-splash-seen') === '1'; } catch (e) {}
      try { sessionStorage.setItem('tc-splash-seen', '1'); } catch (e) {}
      const hideSplash = () => {
        const s = document.getElementById('triskell-splash');
        if (!s) return;
        s.classList.add('is-fading');
        setTimeout(() => s.remove(), seen ? 200 : 700);
      };
      const minDelay = seen ? 150 : 2400;
      const start = Date.now();
      const tryHide = () => {
        const elapsed = Date.now() - start;
        const wait = Math.max(0, minDelay - elapsed);
        setTimeout(hideSplash, wait);
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryHide);
      } else {
        tryHide();
      }
    })();
  </script>

        // Groupe repliable « Outils de recherche » : état mémorisé, et
        // ouverture automatique si l'écran actif est à l'intérieur.
        (function () {
          const head = document.getElementById('nav-group-recherche');
          const items = document.getElementById('nav-group-recherche-items');
          if (!head || !items) return;
          const KEY = 'triskell.nav.recherche.open';
          const setOpen = (open) => {
            items.hidden = !open;
            head.setAttribute('aria-expanded', open ? 'true' : 'false');
            try { localStorage.setItem(KEY, open ? '1' : '0'); } catch (e) {}
          };
          let open = false;
          try { open = localStorage.getItem(KEY) === '1'; } catch (e) {}
          setOpen(open);
          head.addEventListener('click', () => setOpen(items.hidden));
          // Si un outil du groupe devient actif (navigation par le Guide,
          // le lanceur, le Cockpit…), on déplie pour le montrer.
          new MutationObserver(() => {
            if (items.querySelector('.nav-item.active') && items.hidden) {
              setOpen(true);
            }
          }).observe(items, { subtree: true, attributes: true,
                              attributeFilter: ['class'] });
        })();
      </script>
