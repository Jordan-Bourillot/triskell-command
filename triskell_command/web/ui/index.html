        extend: {
          fontFamily: {

            'fab':  '0 6px 16px rgba(99,102,241,0.32), 0 2px 6px rgba(15,23,42,0.10)',

<body class="font-sans antialiased bg-bg text-text h-screen overflow-hidden md:overflow-hidden">

  <!-- ============================================================
       SPLASH SCREEN — Triskelion animé + texte qui apparaît
       Affiché au boot, fade out après ~2.2s
       ============================================================ -->
  <div id="triskell-splash"
       class="fixed inset-0 z-[9999] flex flex-col items-center justify-center"
       style="background: radial-gradient(ellipse at center, #1c1d3a 0%, #0a0b1e 75%); transition: opacity 700ms ease-out;">

    <!-- Triskelion animé -->
    <div id="splash-mark" class="relative" style="width: 180px; height: 180px;">
      <svg viewBox="0 0 200 200" class="w-full h-full" id="splash-svg">
        <defs>
          <filter id="splash-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#6366f1"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#c4b5fd"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
          <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </linearGradient>
        </defs>
        <g transform-origin="100 100" filter="url(#splash-glow)" class="splash-rotor">
          <!-- 3 spirales partant du centre, espacées de 120° -->
          <path class="splash-branch branch-a" fill="url(#g1)"
                d="M 100 100 Q 100 50 78 35 Q 100 60 110 80 Q 105 100 100 100 Z"/>
          <path class="splash-branch branch-b" fill="url(#g2)"
                transform="rotate(120 100 100)"
                d="M 100 100 Q 100 50 78 35 Q 100 60 110 80 Q 105 100 100 100 Z"/>
          <path class="splash-branch branch-c" fill="url(#g3)"
                transform="rotate(240 100 100)"
                d="M 100 100 Q 100 50 78 35 Q 100 60 110 80 Q 105 100 100 100 Z"/>
          <!-- Cercle central -->
          <circle cx="100" cy="100" r="6" fill="#0a0b1e"/>
        </g>
      </svg>
    </div>

    <!-- Texte qui apparaît après la rotation -->
    <div class="splash-name font-display text-white text-5xl font-bold tracking-wider mt-8" style="opacity: 0;">
      Triskell
    </div>
    <div class="splash-sub text-[10px] font-bold tracking-[0.5em] mt-2" style="color: #a78bfa; opacity: 0;">
      COMMAND
    </div>
    <div class="splash-tag mt-10 text-xs" style="color: rgba(255,255,255,0.45); opacity: 0;">
      🌊 Bretagne · 100 % français
    </div>
  </div>

  <style>
    /* === Splash animation === */
    @keyframes splashSpinIn {
      0%   { transform: rotate(-180deg) scale(0.3); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes splashGlowPulse {
      0%, 100% { filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.55)); }
      50%      { filter: drop-shadow(0 0 50px rgba(139, 92, 246, 0.95)); }
    }
    @keyframes splashFadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes splashBranchIn {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: 1; transform: scale(1); }
    }
    #triskell-splash .splash-rotor {
      animation: splashSpinIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: 100px 100px;
    }
    #triskell-splash #splash-mark {
      animation: splashGlowPulse 2.6s ease-in-out infinite 1.4s;
    }
    #triskell-splash .splash-branch {
      transform-origin: 100px 100px;
    }
    #triskell-splash .branch-a { animation: splashBranchIn 0.6s 0.2s both ease-out; }
    #triskell-splash .branch-b { animation: splashBranchIn 0.6s 0.4s both ease-out; }
    #triskell-splash .branch-c { animation: splashBranchIn 0.6s 0.6s both ease-out; }
    #triskell-splash .splash-name { animation: splashFadeUp 0.7s 1.0s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    #triskell-splash .splash-sub  { animation: splashFadeUp 0.7s 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    #triskell-splash .splash-tag  { animation: splashFadeUp 0.7s 1.7s forwards cubic-bezier(0.16, 1, 0.3, 1); }
    #triskell-splash.is-fading { opacity: 0; pointer-events: none; }

    /* Mobile : un peu plus petit */
    @media (max-width: 640px) {
      #triskell-splash #splash-mark { width: 140px !important; height: 140px !important; }
      #triskell-splash .splash-name { font-size: 36px; }
    }
  </style>

  <script>
    // Cache le splash après ~2.4 sec, dès que le DOM est prêt
    (function() {
      const hideSplash = () => {
        const s = document.getElementById('triskell-splash');
        if (!s) return;
        s.classList.add('is-fading');
        setTimeout(() => s.remove(), 700);
      };
      // Au moins 2.4s pour qu'on profite de l'animation, et après DOMContentLoaded
      const minDelay = 2400;
      const start = Date.now();
      const tryHide = () => {
        const elapsed = Date.now() - start;
        const wait = Math.max(0, minDelay - elapsed);
        setTimeout(hideSplash, wait);
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryHide);
      } else {
        tryHide();
      }
    })();
  </script>

          <div class="px-3 text-[10px] font-bold tracking-widest text-text-muted mb-2">PIPELINES SITES</div>
          <button data-view="lagriffe" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Lagriffe · pipeline</span>
          </button>
          <button data-view="rankus" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
            <span>RankUs · pipeline</span>
          </button>
          <button data-view="wow" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 6c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>
            <span>WoW · pipeline</span>
          </button>
        </div>
      </nav>

      <!-- Footer SYSTÈME (compact) -->
      <div class="px-2 py-2 border-t border-border space-y-1">
        <!-- Badge utilisateur (avatar + prénom + engrenage au hover) -->
        <div id="user-badge-slot"></div>
        <!-- Tuto · Réglages · Bretagne · v en une seule ligne discrète -->
        <div class="flex items-center justify-between px-2 pt-1 text-[10px] text-text-muted">
          <div class="flex gap-3">
            <button data-view="tutorial" class="hover:text-text transition-colors">Tuto</button>
            <button data-view="config"   class="hover:text-text transition-colors">Réglages</button>
          </div>
          <div class="flex items-center gap-2">
            <span title="Bretagne · 100 % français">🌊</span>
            <span class="font-bold">v0.6</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===================== Main area ===================== -->
    <main id="main" class="flex-1 overflow-y-auto relative w-full">
      <div id="content" class="px-4 py-5 sm:px-8 sm:py-8 md:px-12 md:py-10 max-w-[1280px]"></div>
    </main>
  </div>

  <!-- ===================== FAB Thomas (chat 1-à-1) ===================== -->
  <!-- Bouton flottant vert au-dessus du Claude FAB. Ouvre la modale de chat. -->
  <button id="thomas-fab"
          class="fixed right-8 z-50 w-14 h-14 rounded-full
                 flex items-center justify-center
                 text-white shadow-fab
                 transition-all duration-200
                 hover:scale-110 hover:shadow-hero
                 cursor-pointer
                 hidden"
          style="bottom: 116px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);"
          title="Chat avec Thomas · F11">
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <span id="thomas-fab-badge"
          class="absolute -top-1 -right-1 min-w-[20px] h-5 px-1.5 rounded-full
                 bg-danger text-white text-[10px] font-bold
                 flex items-center justify-center
                 ring-2 ring-bg
                 hidden">0</span>
  </button>

  <!-- ===================== Dialog Thomas (chat) ===================== -->
  <!-- Mobile : full-screen. Desktop : carte 420x620 ancrée bas-droite. -->
  <div id="thomas-dialog"
       class="fixed inset-0 z-[60] bg-black/40 hidden items-stretch sm:items-end justify-stretch sm:justify-end p-0 sm:p-8">
    <div class="bg-surface w-full sm:w-[420px] h-full sm:h-[620px] sm:max-h-[90vh] sm:rounded-2xl
                shadow-lift flex flex-col overflow-hidden sm:border border-border">
      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-3
                  border-b border-border bg-surface-elevated">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full
                      flex items-center justify-center text-white font-bold"
               style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);"
               id="thomas-dialog-avatar">T</div>
          <div>
            <div id="thomas-dialog-name"
                 class="text-sm font-semibold text-text">Thomas</div>
            <div id="thomas-dialog-status"
                 class="text-[11px] text-text-muted">Chat 1-à-1</div>
          </div>
        </div>
        <button id="thomas-dialog-close"
                class="w-8 h-8 rounded-lg flex items-center justify-center
                       text-text-muted hover:text-text hover:bg-bg
                       transition-colors text-xl leading-none">×</button>
      </div>

      <!-- Liste des messages -->
      <div id="thomas-messages"
           class="flex-1 overflow-y-auto px-4 py-3 space-y-2 bg-bg"></div>

      <!-- Typing indicator (caché par défaut) -->
      <div id="thomas-typing"
           class="px-5 py-1 text-[11px] text-text-muted italic hidden">
        Thomas écrit…
      </div>

      <!-- Composer -->
      <div class="p-3 border-t border-border bg-surface flex gap-2">
        <input id="thomas-input" type="text"
               placeholder="Écris un message à Thomas…"
               autocomplete="off"
               class="flex-1 px-3 py-2 rounded-lg bg-bg
                      border border-border
                      text-sm text-text
                      placeholder:text-text-muted
                      focus:border-accent focus:outline-none
                      transition-colors"/>
        <button id="thomas-send"
                class="px-4 py-2 rounded-lg
                       bg-gradient-to-br from-accent to-accent-hover
                       text-white text-sm font-semibold
                       hover:shadow-soft transition-all
                       disabled:opacity-50 disabled:cursor-not-allowed">
          Envoyer
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== FAB Allô Claude ===================== -->
  <!-- Bloc flottant : label à gauche + bouton rond à droite -->
  <div id="claude-fab-wrap"
       class="fixed bottom-8 right-8 flex items-center gap-3 z-50">
    <!-- Label "Allô Claude" -->
    <span id="claude-fab-label"
          class="px-3 py-1.5 rounded-full text-sm font-semibold
                 bg-surface text-accent
                 shadow-soft border border-border
                 select-none cursor-pointer
                 transition-all duration-200
                 hover:scale-105 hover:shadow-lift">
      Allô Claude
    </span>
    <!-- Bouton rond -->
    <button id="claude-fab"
            class="relative w-16 h-16 rounded-full
                   bg-gradient-to-br from-accent to-accent-glow
                   shadow-fab flex items-center justify-center
                   text-white
                   transition-all duration-200
                   hover:scale-110 hover:shadow-hero
                   animate-breathe
                   cursor-pointer"
            title="Allô Claude · F12">
      <!-- Icône custom : bulle de dialogue + étincelle à l'intérieur -->
      <svg id="claude-fab-icon" class="w-7 h-7" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-5.3A8 8 0 1 1 21 12z" fill="currentColor" fill-opacity="0.18"/>
        <path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-5.3A8 8 0 1 1 21 12z"/>
        <path d="M12 8.5v3M12 12.5v3M8.5 12h3M12.5 12h3" stroke-width="1.6"/>
      </svg>
      <span id="claude-fab-dot"
            class="absolute top-1.5 right-1.5 w-3.5 h-3.5 rounded-full
                   bg-danger ring-2 ring-bg hidden"></span>
    </button>
  </div>
