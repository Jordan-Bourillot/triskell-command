<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8" />
<title>Le Phare — preview</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/main.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: Inter, sans-serif; padding: 24px; background: hsl(var(--bg)); color: hsl(var(--text)); }</style>
</head>
<body>
<div style="position:fixed;top:8px;right:8px;z-index:9999;display:flex;gap:6px;">
  <button onclick="goto('home')" style="padding:4px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:11px">Home</button>
  <button onclick="goto('site')" style="padding:4px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:11px">Site</button>
  <button onclick="goto('coulisses')" style="padding:4px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:11px">Coulisses</button>
  <button onclick="resetOnboard()" style="padding:4px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:11px">Onboarding</button>
</div>
<div id="content"></div>

<script>
// Mock complet de l'app : permet à phare.js de tourner sans le backend
const App = {
  show(view) { Phare.render(document.getElementById('content')); },
  api: {
    async phare_home() {
      return { ok: true, sites: [
        { id: 's1', name: 'Pack Électricien Pro', domain: 'pack-elec.triskell-studio.fr',
          is_external_client: false, health: 92, health_tone: 'ok',
          clicks_30d: 1840, delta_pct: 12, pending_count: 3, has_bulletin: true },
        { id: 's2', name: 'Studio PDF', domain: 'studio-pdf.triskell-studio.fr',
          is_external_client: false, health: 88, health_tone: 'ok',
          clicks_30d: 920, delta_pct: -3, pending_count: 0, has_bulletin: false },
        { id: 's3', name: 'Bobeez', domain: 'bobeez.triskell-studio.fr',
          is_external_client: false, health: 64, health_tone: 'warn',
          clicks_30d: 410, delta_pct: 8, pending_count: 5, has_bulletin: true },
        { id: 's4', name: 'Cabinet Dupont', domain: 'cabinet-dupont.fr',
          is_external_client: true, health: 42, health_tone: 'bad',
          clicks_30d: 120, delta_pct: -22, pending_count: 8, has_bulletin: false },
        { id: 's5', name: 'Triskell Studio', domain: 'triskell-studio.fr',
          is_external_client: false, health: null, health_tone: 'unknown',
          clicks_30d: 0, delta_pct: null, pending_count: 0, has_bulletin: false },
      ]};
    },
    async phare_site_dashboard({ id }) {
      const sites = {
        s1: { name: 'Pack Électricien Pro', domain: 'pack-elec.triskell-studio.fr' },
        s2: { name: 'Studio PDF', domain: 'studio-pdf.triskell-studio.fr' },
        s3: { name: 'Bobeez', domain: 'bobeez.triskell-studio.fr' },
        s4: { name: 'Cabinet Dupont', domain: 'cabinet-dupont.fr' },
        s5: { name: 'Triskell Studio', domain: 'triskell-studio.fr' },
      };
      return { ok: true,
        site: { ...(sites[id] || sites.s1), id, is_external_client: id === 's4' },
        kpis: { clicks_30d: 1840, position_avg: 8.4, health: 92, health_tone: 'ok', delta_pct: 12 },
        to_review: [
          { id: 'a1', title: 'Réécrire le title de la home', agent: 'optimiseur_onpage',
            kind: 'pr_modif', impact: 4, created_at: '2026-05-17',
            detail_md: 'Le title actuel fait 38 caractères et ne contient pas le mot-clé principal. Je propose : « Pack Électricien Pro — Devis instantané en 2 minutes ». Plus précis, plus accrocheur, et le mot-clé arrive en tête.',
            netlify_preview_url: 'https://deploy-preview-42.netlify.app' },
          { id: 'a2', title: 'Ajouter les meta descriptions manquantes (3 pages)', agent: 'optimiseur_onpage',
            kind: 'pr_modif', impact: 3, created_at: '2026-05-17',
            detail_md: 'Les pages /devis, /tarifs et /contact n\'ont pas de meta description. Google génère alors un extrait aléatoire. J\'en ai rédigé trois — voir le brouillon.' },
          { id: 'a3', title: 'Bulletin 2026-05-17 — plateau', agent: 'analyste',
            kind: 'recommandation', impact: 2, created_at: '2026-05-17',
            detail_md: 'Trafic stable cette semaine. La home a perdu 2 places sur « pack electricien ». À surveiller.' },
        ],
        recently_done: [
          { id: 'd1', title: 'Schema Organization en JSON-LD sur la home', agent: 'optimiseur_onpage',
            created_at: '2026-05-15', github_pr_url: 'https://github.com/example/repo/pull/41' },
          { id: 'd2', title: 'Maillage : 4 nouveaux liens internes', agent: 'tisseur',
            created_at: '2026-05-12' },
        ],
        bulletin: { id: 'b1', title: "Aujourd'hui ça va",
          detail_md: 'Trafic en hausse de 12% ce mois-ci. La page /pack-electricien-pro grimpe à la position 6 sur Google (était 14e). À continuer.',
          created_at: '2026-05-17', agent: 'analyste' },
      };
    },
    async phare_run_audit() { return { ok: true, started: true }; },
    async phare_merge_action() { return { ok: true }; },
    async phare_reject_action() { return { ok: true }; },
    async phare_agents_status() { return { ok: true, agents: Phare._defaultAgents() }; },
    async phare_run_agent() { return { ok: true, started: true }; },
    async phare_site_upsert() { return { ok: true, site: { id: 'new' } }; },
  },
};

function goto(view) {
  Phare.view = view;
  if (view === 'site') Phare.selectedSite = 's1';
  App.show('phare');
}
function resetOnboard() {
  localStorage.removeItem('phare_onboarded_v1');
  Phare.view = 'home';
  App.show('phare');
}
</script>
<script src="scripts/phare.js"></script>
<script>
// Rendu initial
window.addEventListener('DOMContentLoaded', () => {
  Phare.render(document.getElementById('content'));
});
</script>
</body>
</html>
