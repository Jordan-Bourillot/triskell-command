<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion · Triskell Command</title>

  <!-- Applique le thème choisi dans l'app (mémorisé) avant tout rendu : pas de flash blanc -->
  <script>try{var t=localStorage.getItem('tc-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: hsl(var(--bg));
      color: hsl(var(--text));
    }
    .display { font-family: 'Cinzel', serif; }
    .field {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid hsl(var(--border));
      border-radius: 12px;
      background: hsl(var(--surface));
      color: hsl(var(--text));
      font-size: 15px;
      outline: none;
      transition: border-color .16s, box-shadow .16s;
    }
    .field:focus {
      border-color: hsl(var(--accent));
      box-shadow: 0 0 0 3px hsl(var(--accent) / 0.18);
    }
    .btn-primary {
      width: 100%;
      padding: 12px 18px;
      background: hsl(var(--accent));
      color: white;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: filter .16s, transform .08s;
      cursor: pointer;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-500
                  flex items-center justify-center text-white text-3xl shadow-lg">⛯</div>
      <div class="display text-2xl font-bold mt-4">Triskell</div>
      <div class="text-[11px] tracking-widest font-bold mt-1" style="color: hsl(var(--accent))">COMMAND</div>
      <p class="text-[13px] mt-3 max-w-xs mx-auto" style="color: hsl(var(--text-muted)); text-wrap: pretty">
        Le tableau de bord du studio : prospection, mails, clients et sites — tout au même endroit.
      </p>
    </div>

    <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm"
         style="background: hsl(var(--surface)); border-color: hsl(var(--border))">
      <h1 class="text-lg font-semibold mb-1">Connexion</h1>
      <p class="text-sm mb-5" style="color: hsl(var(--text-muted))">Identifie-toi pour accéder au tableau de bord.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-medium mb-1.5" style="color: hsl(var(--text-muted))">Utilisateur</label>
          <select id="username" name="username" required autocomplete="username" class="field">
            <option value="jordan">Jordan</option>
            <option value="thomas">Thomas</option>
          </select>
        </div>
        <div>
          <label for="password" class="block text-xs font-medium mb-1.5" style="color: hsl(var(--text-muted))">Mot de passe</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" class="field" />
        </div>
        <div id="error" role="alert" aria-live="assertive" class="text-sm text-red-600 hidden"></div>
        <button id="submit" type="submit" class="btn-primary">Se connecter</button>
      </form>
    </div>

    <div class="text-center text-[11px] mt-6" style="color: hsl(var(--text-muted))">
      🌊 Triskell Studio · Bretagne
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errEl = document.getElementById('error');
    const btn  = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connexion…';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password }),
        });
        const j = await r.json();
        if (!r.ok || !j.ok) {
          throw new Error(j.error === 'credentials_invalid'
            ? 'Identifiant ou mot de passe incorrect.'
            : (j.error || 'Erreur inconnue.'));
        }
        // Connecté → redirection vers l'app
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message || 'Échec de connexion.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
